name: Android 测试台 APK

on:
  push:
    branches: [main]
    paths:
      - 'Revolution.Android/Android_APP/**'
      - 'Revolution.Android/revandroid/**'
      - '.github/workflows/android-companion.yml'
  pull_request:
    paths:
      - 'Revolution.Android/Android_APP/**'
      - 'Revolution.Android/revandroid/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Revolution.Android/Android_APP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Revolution-Android-Test-Companion
          path: Revolution.Android/Android_APP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
